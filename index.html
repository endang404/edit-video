<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Edit Video AI</title>
<style>
:root{--acc:#00e0c6;--panel:#161616;--line:#2a2a2a;--txt:#f2f2f2;--mut:#8a8a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);user-select:none;-webkit-user-select:none;overflow:hidden}
button{font-family:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:4px;padding:6px 10px}
header h1{font-size:16px;margin:0 0 0 4px;flex:1;font-weight:700}
.ib{background:none;border:0;color:var(--txt);font-size:20px;padding:6px 8px;border-radius:8px}
.ib:disabled{opacity:.3}
.pri{background:var(--acc);color:#000;border:0;border-radius:18px;padding:8px 16px;font-weight:700;font-size:14px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;background:#0b0b0b}
#out{background:#000;touch-action:none;display:block}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mut);text-align:center;padding:20px}
#ctrl{display:flex;align-items:center;justify-content:space-between;padding:4px 10px}
#time{font-variant-numeric:tabular-nums;font-size:13px;color:#ccc;min-width:120px}
#play{font-size:26px;width:56px}
.zb{display:flex;gap:2px;min-width:120px;justify-content:flex-end}
#tlwrap{position:relative;height:142px;background:#0a0a0a;border-top:1px solid var(--line);flex:0 0 auto}
#tl{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#tl::-webkit-scrollbar{display:none}
#inner{position:relative;height:100%}
#playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;pointer-events:none;box-shadow:0 0 4px #000;z-index:2}
.tick{position:absolute;top:2px;font-size:10px;color:var(--mut);border-left:1px solid #333;padding-left:3px;height:14px;pointer-events:none}
.clip{position:absolute;top:22px;height:56px;border-radius:6px;background-color:#333;background-repeat:repeat-x;background-size:auto 100%;border:2px solid transparent;overflow:hidden}
.clip.sel{border-color:#fff}
.badge{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.72);font-size:10px;padding:1px 5px;border-radius:4px;pointer-events:none;white-space:nowrap}
.trk{position:absolute;height:24px;border-radius:5px;font-size:11px;line-height:20px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:2px solid transparent}
.trk.txt{top:84px;background:#6d43e8}
.trk.mus{background:#1f8f4e}
.trk.mus.ex{background:#2a6fdb}
.trk.sel{border-color:#fff}
.addbtn{position:absolute;top:32px;width:36px;height:36px;border-radius:8px;background:#fff;color:#000;border:0;font-size:22px;font-weight:700;line-height:36px;padding:0}
nav#tools{display:flex;overflow-x:auto;gap:0;padding:8px 4px;background:#0f0f0f;border-top:1px solid var(--line);scrollbar-width:none;flex:0 0 auto}
nav#tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 64px;background:none;border:0;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;padding:4px 0;white-space:nowrap}
.tool i{font-style:normal;font-size:20px;height:24px;line-height:24px;font-weight:800}
.tool.ai i{background:linear-gradient(135deg,#00e0c6,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.tool.ai{color:var(--acc);font-weight:700}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:16px 16px 0 0;max-height:62vh;max-height:62dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s;z-index:20;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 30px rgba(0,0,0,.6)}
#sheet.open{transform:none}
.sh{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.sh b{flex:1;font-size:15px}
#sheetBody{overflow-y:auto;padding:6px 14px 18px;-webkit-overflow-scrolling:touch}
.row{margin:12px 0}
.row>label{display:flex;justify-content:space-between;font-size:12px;color:#bbb;margin-bottom:6px}
h4{margin:16px 0 4px;font-size:13px;color:var(--acc);font-weight:700}
input[type=range]{width:100%;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#262626;color:var(--txt);border:1px solid #333;border-radius:16px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
.fcard{width:76px;border-radius:10px;border:2px solid transparent;background:#222;color:var(--txt);padding:0 0 6px;font-size:11px;overflow:hidden}
.fcard canvas{width:100%;height:56px;display:block;background:#333;margin-bottom:5px}
.fcard.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.btn{background:#262626;color:var(--txt);border:0;border-radius:10px;padding:11px 14px;font-size:14px}
.btn.full{width:100%}
.btn.danger{color:#ff6b6b}
.btn.acc{background:var(--acc);color:#000;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea,input[type=text],input[type=password]{width:100%;background:#0d0d0d;color:var(--txt);border:1px solid #333;border-radius:10px;padding:10px;font-size:16px;font-family:inherit;user-select:text;-webkit-user-select:text}
textarea{resize:none}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #444;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
#chat{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.msg{padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.4;max-width:92%;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.msg.u{align-self:flex-end;background:#2b2b2b}
.msg.a{align-self:flex-start;background:#0f2e2a;border:1px solid #145a52}
.msg.e{align-self:flex-start;background:#3a1414;border:1px solid #6b2020}
.msg small{display:block;margin-top:6px;font-size:12px;color:#8fe;white-space:pre-wrap}
.note{font-size:12px;color:var(--mut);line-height:1.45;margin:8px 0}
.note a{color:var(--acc)}
.airow{display:flex;gap:8px;align-items:flex-end}
.airow textarea{flex:1}
.airow .btn{height:46px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:#ccc;margin:8px 0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(40,40,40,.95);padding:10px 16px;border-radius:20px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86%;text-align:center}
#toast.show{opacity:1}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#ov.show{display:flex}
.bar{width:80%;height:6px;background:#333;border-radius:3px;overflow:hidden}
.bar>div{height:100%;background:var(--acc);width:0}
#ovBtns{display:flex;flex-direction:column;gap:10px;width:80%}
#hid{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden}
#hid video{width:2px;height:2px}
.spin{width:16px;height:16px;border:2px solid #555;border-top-color:var(--acc);border-radius:50%;display:inline-block;animation:sp 0.8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>Edit Video <span style="color:var(--acc)">AI</span></h1>
  <button class="ib" id="bUndo" title="Undo">↶</button>
  <button class="ib" id="bRedo" title="Redo">↷</button>
  <button class="ib" id="bSet" title="Pengaturan AI">⚙︎</button>
  <button class="pri" id="bExport">Ekspor</button>
</header>

<div id="stage">
  <canvas id="out" width="720" height="1280"></canvas>
  <div id="empty">
    <div style="font-size:40px">🎬</div>
    <div>Belum ada video.<br>Tambahkan video atau foto dari galeri.</div>
    <button class="pri" id="bAddFirst">+ Tambah Media</button>
  </div>
</div>

<div id="ctrl">
  <div id="time">00:00.0 / 00:00.0</div>
  <button class="ib" id="play">▶</button>
  <div class="zb"><button class="ib" id="zOut">－</button><button class="ib" id="zIn">＋</button></div>
</div>

<div id="tlwrap">
  <div id="tl"><div id="inner"></div></div>
  <div id="playhead"></div>
</div>

<nav id="tools"></nav>

<div id="sheet">
  <div class="sh"><b id="sheetTitle"></b><button class="pri" id="sheetDone">Selesai</button></div>
  <div id="sheetBody"></div>
</div>

<div id="ov">
  <div id="ovTitle" style="font-size:17px;font-weight:700">Mengekspor…</div>
  <div class="bar"><div id="ovBar"></div></div>
  <div id="ovInfo" class="note"></div>
  <div id="ovBtns"></div>
</div>

<div id="toast"></div>
<div id="hid"></div>
<input type="file" id="fileVid" accept="video/*,image/*" multiple hidden>
<input type="file" id="fileAud" accept="audio/*" multiple hidden>
<input type="file" id="fileAudVid" accept="video/*" hidden>

<script>
'use strict';
/* ============ Util ============ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0'); };
const even = x => Math.max(2, Math.round(x / 2) * 2);
const easeOut = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const DEG = Math.PI / 180;
const NOCLIP = 'Tambahkan video dulu';
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

/* ============ Filter: dasar + film ============ */
// b kecerahan, c kontras, s saturasi, t suhu, v vinyet, g hitam-putih, sp sepia,
// gr grain, lf pudar (angkat hitam), sh/hl tint bayangan/sorotan, ca aberasi kromatik, lk kebocoran cahaya
const BASEF = { b: 0, c: 1, s: 1, t: 0, v: 0, g: 0, sp: 0, gr: 0, lf: 0, sh: [0, 0, 0], hl: [0, 0, 0], ca: 0, lk: 0 };
const defFilter = () => JSON.parse(JSON.stringify(BASEF));
const PRESETS = {
  asli:      { name: 'Asli',          cat: 'dasar', f: {} },
  cerah:     { name: 'Cerah',         cat: 'dasar', f: { b: 0.06, c: 1.08, s: 1.18 } },
  hangat:    { name: 'Hangat',        cat: 'dasar', f: { b: 0.02, c: 1.05, s: 1.1, t: 0.6, v: 0.1 } },
  dingin:    { name: 'Dingin',        cat: 'dasar', f: { c: 1.05, s: 0.95, t: -0.6, v: 0.1 } },
  vintage:   { name: 'Vintage',       cat: 'dasar', f: { b: 0.03, c: 0.9, s: 0.8, t: 0.3, v: 0.35, sp: 0.45 } },
  bw:        { name: 'Hitam Putih',   cat: 'dasar', f: { c: 1.15, v: 0.2, g: 1 } },
  dramatis:  { name: 'Dramatis',      cat: 'dasar', f: { b: -0.04, c: 1.35, s: 0.85, v: 0.45 } },
  pudar:     { name: 'Pudar',         cat: 'dasar', f: { b: 0.08, c: 0.8, s: 0.7, t: 0.1 } },
  sinematik: { name: 'Sinematik',     cat: 'dasar', f: { b: -0.02, c: 1.2, s: 0.9, t: -0.2, v: 0.3 } },
  kodak:     { name: 'Kodak Gold',    cat: 'film', f: { b: 0.02, c: 1.05, s: 1.15, t: 0.35, v: 0.2, gr: 0.35, lf: 0.04, sh: [0.15, 0.05, -0.1], hl: [0.2, 0.12, -0.1] } },
  fuji:      { name: 'Fuji 400',      cat: 'film', f: { s: 0.95, t: -0.15, v: 0.15, gr: 0.3, lf: 0.06, sh: [-0.05, 0.12, 0.08], hl: [0.05, 0.1, 0.02] } },
  portra:    { name: 'Portra',        cat: 'film', f: { b: 0.03, c: 0.95, s: 0.9, t: 0.2, gr: 0.25, lf: 0.05, sh: [0.05, 0.02, 0], hl: [0.15, 0.08, 0] } },
  cinestill: { name: 'Cinestill 800T',cat: 'film', f: { c: 1.1, s: 1.05, t: -0.35, v: 0.3, gr: 0.35, sh: [-0.05, 0.05, 0.2], hl: [0.25, 0.05, 0.05], lk: 0.25 } },
  tealorg:   { name: 'Teal & Orange', cat: 'film', f: { c: 1.2, s: 1.1, v: 0.3, gr: 0.15, sh: [-0.2, 0.05, 0.25], hl: [0.25, 0.1, -0.15] } },
  polaroid:  { name: 'Polaroid',      cat: 'film', f: { b: 0.05, c: 0.85, s: 0.8, t: 0.25, v: 0.3, gr: 0.3, lf: 0.12, sh: [0, 0.08, 0.15], hl: [0.15, 0.1, -0.05] } },
  th70:      { name: 'Film 70an',     cat: 'film', f: { b: 0.02, c: 0.9, s: 0.75, t: 0.5, sp: 0.25, v: 0.4, gr: 0.45, lf: 0.1, lk: 0.5 } },
  noir:      { name: 'Film Noir',     cat: 'film', f: { b: -0.03, c: 1.45, g: 1, v: 0.55, gr: 0.45 } },
  vhs:       { name: 'VHS',           cat: 'film', f: { b: 0.02, c: 1.1, s: 1.25, v: 0.2, gr: 0.5, lf: 0.05, ca: 1 } },
  lomo:      { name: 'Lomo',          cat: 'film', f: { c: 1.35, s: 1.3, v: 0.7, gr: 0.3, sh: [0, 0, 0.15], hl: [0.1, 0.1, -0.1] } },
  kenangan:  { name: 'Kenangan',      cat: 'film', f: { b: 0.06, c: 0.8, s: 0.6, t: 0.15, gr: 0.3, lf: 0.18, lk: 0.2 } },
};
const presetFilter = k => Object.assign(defFilter(), JSON.parse(JSON.stringify((PRESETS[k] || PRESETS.asli).f)));

/* ============ Animasi klip ============ */
const ANIMS = [['none', 'Tanpa'], ['fade', 'Pudar'], ['zoomIn', 'Perbesar'], ['zoomOut', 'Perkecil'], ['slideL', 'Geser kiri'], ['slideR', 'Geser kanan'], ['slideU', 'Geser atas'], ['slideD', 'Geser bawah'], ['spin', 'Putar']];

/* ============ State & history ============ */
let S = { clips: [], texts: [], music: [], aspect: '9:16' };
const media = {};            // id -> {id,url,name,type,el,duration,w,h,thumb,gain}
let sel = { type: null, id: null };
let undoStack = [], redoStack = [];
const snap = () => JSON.stringify(S);
function pushUndo() { undoStack.push(snap()); if (undoStack.length > 80) undoStack.shift(); redoStack = []; updUndo(); }
function undo() { if (!undoStack.length) return; stopPlay(); redoStack.push(snap()); S = JSON.parse(undoStack.pop()); changed(); }
function redo() { if (!redoStack.length) return; stopPlay(); undoStack.push(snap()); S = JSON.parse(redoStack.pop()); changed(); }
function updUndo() { $('#bUndo').disabled = !undoStack.length; $('#bRedo').disabled = !redoStack.length; }

const dur = c => (c.out - c.in) / (c.speed || 1);
const adur = mu => (mu.out - mu.in) / (mu.speed || 1);
const total = () => S.clips.reduce((a, c) => a + dur(c), 0);
function starts() { let a = 0; return S.clips.map(c => { const s = a; a += dur(c); return s; }); }
function clipAt(t) {
  let a = 0;
  for (let i = 0; i < S.clips.length; i++) {
    const c = S.clips[i], d = dur(c);
    if (t < a + d || (i === S.clips.length - 1 && t <= a + d + 1e-6)) return { c, i, start: a };
    a += d;
  }
  return null;
}
function getClip() {
  if (sel.type === 'clip') { const c = S.clips.find(c => c.id === sel.id); if (c) return c; }
  const a = clipAt(T); return a ? a.c : null;
}
function newClip(m) {
  return normClip({ id: uid(), mediaId: m.id, in: 0, out: m.type === 'image' ? 3 : (m.duration || 1), speed: 1, volume: 1, preset: 'asli' });
}
function normClip(c) {
  c.filter = Object.assign(defFilter(), c.filter || {});
  if (c.scale == null) c.scale = c.zoom || 1; delete c.zoom;
  if (c.tx == null) c.tx = 0; if (c.ty == null) c.ty = 0; if (c.rot == null) c.rot = 0;
  if (c.flipH == null) c.flipH = false; if (c.flipV == null) c.flipV = false;
  if (c.fit == null) c.fit = 'contain';
  if (c.aIn == null) { c.aIn = c.fadeIn > 0 ? 'fade' : 'none'; c.aInD = c.fadeIn || 0.5; }
  if (c.aOut == null) { c.aOut = c.fadeOut > 0 ? 'fade' : 'none'; c.aOutD = c.fadeOut || 0.5; }
  delete c.fadeIn; delete c.fadeOut;
  if (c.afIn == null) c.afIn = 0; if (c.afOut == null) c.afOut = 0;
  if (c.pitch == null) c.pitch = true; if (c.fInt == null) c.fInt = 1;
  if (c.speed == null) c.speed = 1; if (c.volume == null) c.volume = 1;
  return c;
}
function normAudio(mu) {
  if (mu.speed == null) mu.speed = 1; if (mu.fadeIn == null) mu.fadeIn = 0; if (mu.fadeOut == null) mu.fadeOut = 0;
  if (mu.pitch == null) mu.pitch = true; if (mu.volume == null) mu.volume = 1; return mu;
}

/* ============ Canvas output & WebGL ============ */
const out = $('#out'), octx = out.getContext('2d');
let glc = null, gl = null, prog, tex; const U = {};
const t0 = performance.now();
function initGL() {
  try {
    glc = document.createElement('canvas');
    gl = glc.getContext('webgl', { preserveDrawingBuffer: true, premultipliedAlpha: false, antialias: false });
    if (!gl) return;
    const vs = 'attribute vec2 p;varying vec2 v;void main(){v=vec2((p.x+1.)*.5,(1.-p.y)*.5);gl_Position=vec4(p,0.,1.);}';
    const fs = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 v;uniform sampler2D u_tex;uniform vec2 u_res,u_disp,u_off,u_flip;uniform float u_rot;
uniform float u_b,u_c,u_s,u_t,u_vg,u_g,u_sp,u_fd,u_gr,u_lf,u_ca,u_lk,u_time,u_int;uniform vec3 u_sh,u_hl;
const vec3 LUM=vec3(.299,.587,.114);
void main(){
 vec2 px=(v-.5)*u_res-u_off;
 float cs=cos(u_rot),sn=sin(u_rot);
 px=vec2(cs*px.x+sn*px.y,-sn*px.x+cs*px.y);
 vec2 q=px/u_disp*u_flip+.5;
 if(q.x<0.||q.x>1.||q.y<0.||q.y>1.){gl_FragColor=vec4(0.,0.,0.,1.);return;}
 vec3 o=texture2D(u_tex,q).rgb;vec3 c=o;
 if(u_ca>0.){vec2 d=(q-.5)*u_ca*.012;c.r=texture2D(u_tex,clamp(q+d,0.,1.)).r;c.b=texture2D(u_tex,clamp(q-d,0.,1.)).b;}
 c+=u_b;c=(c-.5)*u_c+.5;
 float l=dot(c,LUM);c=mix(vec3(l),c,u_s);
 c.r+=u_t*.08;c.b-=u_t*.08;
 vec3 se=vec3(dot(c,vec3(.393,.769,.189)),dot(c,vec3(.349,.686,.168)),dot(c,vec3(.272,.534,.131)));
 c=mix(c,se,u_sp);
 c=mix(c,vec3(dot(c,LUM)),u_g);
 l=clamp(dot(c,LUM),0.,1.);
 c+=u_sh*(1.-smoothstep(0.,.55,l))*.3+u_hl*smoothstep(.45,1.,l)*.3;
 c=c*(1.-u_lf)+u_lf*.9;
 if(u_lk>0.){float ar=u_res.x/u_res.y;vec2 lp=vec2(1.+.08*sin(u_time*.6),.15+.1*sin(u_time*.37));
  float k=1.-smoothstep(0.,.9,distance(v*vec2(ar,1.),lp*vec2(ar,1.)));c+=u_lk*k*vec3(1.,.42,.12)*.7;}
 float dd=distance(v,vec2(.5));c*=1.-u_vg*smoothstep(.3,.8,dd);
 if(u_gr>0.){float n=fract(sin(dot(floor(v*u_res)+fract(u_time*7.)*91.,vec2(12.9898,78.233)))*43758.5453)-.5;c+=n*u_gr*.22;}
 c=mix(o,clamp(c,0.,1.),u_int);
 gl_FragColor=vec4(c*u_fd,1.);
}`;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };

async function doExport(audioOnly) {

  $('#ovTitle').textContent = audioOnly ? 'Mengekspor audio…' : 'Mengekspor video ' + expQuality + '…'; $('#ovBar').style.width = '0%';
  $('#ovInfo').textContent = 'Biarkan layar tetap menyala dan jangan pindah aplikasi. Ekspor berjalan sesuai durasi (' + fmt(total()) + ').';
  const bb = $('#ovBtns'); bb.innerHTML = '';
  const cancel = mk('button', { class: 'btn full', text: 'Batal' });
  cancel.onclick = () => { exporting = false; stopPlay(); rec.onstop = null; try { rec.stop(); } catch (e) { } renderScale = 1; resizeOut(); $('#ov').classList.remove('show'); sel = prevSel; dirty = true; };
